name: Release
run-name: Release version "${{ github.event.release.tag_name }}"
on:
  release:
    types: [published]
    branches:
      - main
      - master
jobs:
  # Release vX.Y.Z runs on its own image, supervisely/export-pointclouds-to-las:<SDK>-X.Y.Z, which carries the app's
  # code: config.json must name it before anything is built or released.
  check-image:
    if: "!github.event.release.prerelease"
    runs-on: gha-runner-supervisely-ecosystem
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: config.json names the image of this release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 docker/check_image.py --release "$RELEASE_TAG"
  # Builds config.json's image from the release's commit. A tag that is already on Docker Hub (a re-run) is kept,
  # never rebuilt over.
  build-image:
    if: "!github.event.release.prerelease"
    needs: check-image
    uses: supervisely-ecosystem/workflows/.github/workflows/build_image_from_template.yml@master
    with:
      image_name: "${{ github.event.repository.name }}"
      dockerfile_template_path: "docker/Dockerfile.tmpl"
      cve_checks: true
      # zstd layers: a smaller download that unpacks faster; agents need Docker 23+ / containerd 1.5+
      compression: zstd
  Supervisely-Release:
    if: "!github.event.release.prerelease"
    needs: build-image
    uses: supervisely-ecosystem/workflows/.github/workflows/common.yml@master
    secrets:
      SUPERVISELY_DEV_API_TOKEN: "${{ secrets.SUPERVISELY_DEV_API_TOKEN }}"
      SUPERVISELY_PRIVATE_DEV_API_TOKEN: "${{ secrets.SUPERVISELY_PRIVATE_DEV_API_TOKEN }}"
      SUPERVISELY_PROD_API_TOKEN: "${{ secrets.SUPERVISELY_PROD_API_TOKEN }}"
      GH_ACCESS_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
    with:
      SUPERVISELY_SERVER_ADDRESS: "${{ vars.SUPERVISELY_DEV_SERVER_ADDRESS }}"
      SUPERVISELY_PROD_SERVER_ADDRESS: "${{ vars.SUPERVISELY_PROD_SERVER_ADDRESS }}"
      SLUG: "${{ github.repository }}"
      RELEASE_VERSION: "${{ github.event.release.tag_name }}"
      RELEASE_DESCRIPTION: "${{ github.event.release.name }}"
      RELEASE_TYPE: "release"
      SUBAPP_PATHS: "__ROOT_APP__"
